<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Assignment | Campus Notes</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="logo">
                <i class="fas fa-graduation-cap logo-icon"></i> Campus Notes
            </a>
            <ul class="nav-links" id="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="assignments.html">Assignments</a></li>
                <li><a href="create.html" class="active">Create Post</a></li>
                <li><a href="dashboard.html">Dashboard</a></li>
                <li><a href="about.html">About</a></li>
            </ul>
            <div class="hamburger" id="hamburger">
                <i class="fas fa-bars"></i>
            </div>
        </div>
    </nav>

    <main>
        <div class="form-container">
            <h1 class="post-title" id="page-title" style="margin-bottom: 2rem; font-size: 2rem;">Create a New Assignment</h1>
            
            <form id="assignment-form">
                <div class="form-group">
                    <label for="title">Assignment Title <span style="color: var(--danger-color)">*</span></label>
                    <input type="text" id="title" class="form-control" placeholder="e.g., Introduction to Neural Networks" required>
                </div>
                
                <div class="form-group" style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                    <div>
                        <label for="author">Author Name <span style="color: var(--danger-color)">*</span></label>
                        <input type="text" id="author" class="form-control" placeholder="Your full name" required>
                    </div>
                    <div>
                        <label for="category">Category</label>
                        <select id="category" class="form-control">
                            <option value="Assignment">Assignment</option>
                            <option value="Notes">Study Notes</option>
                            <option value="Tutorial">Tutorial</option>
                            <option value="Project">Project Report</option>
                        </select>
                    </div>
                </div>

                <div class="form-group" style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                    <div>
                        <label for="subject">Subject</label>
                        <select id="subject" class="form-control">
                            <option value="Web Development">Web Development</option>
                            <option value="Database Management">Database Management</option>
                            <option value="Computer Networks">Computer Networks</option>
                            <option value="Operating Systems">Operating Systems</option>
                            <option value="Software Engineering">Software Engineering</option>
                            <option value="Data Structures">Data Structures</option>
                        </select>
                    </div>
                    <div>
                        <label for="semester">Semester</label>
                        <select id="semester" class="form-control">
                            <option value="Semester 1">Semester 1</option>
                            <option value="Semester 2">Semester 2</option>
                            <option value="Semester 3">Semester 3</option>
                            <option value="Semester 4">Semester 4</option>
                            <option value="Semester 5">Semester 5</option>
                            <option value="Semester 6">Semester 6</option>
                            <option value="Semester 7">Semester 7</option>
                            <option value="Semester 8">Semester 8</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label for="tags">Tags (comma separated)</label>
                    <input type="text" id="tags" class="form-control" placeholder="e.g., HTML, CSS, JavaScript">
                </div>

                <div class="form-group">
                    <label for="description">Short Description <span style="color: var(--danger-color)">*</span></label>
                    <textarea id="description" class="form-control" style="min-height: 80px;" placeholder="Brief summary of the content..." maxlength="150" required></textarea>
                </div>

                <div class="form-group">
                    <label for="content">Full Content (HTML supported) <span style="color: var(--danger-color)">*</span></label>
                    <textarea id="content" class="form-control" placeholder="Write the full assignment content here..." required></textarea>
                </div>

                <div class="form-group">
                    <label>Cover Image (Optional)</label>
                    <input type="file" id="image" class="form-control" accept="image/*" style="padding: 0.5rem;">
                    <div class="image-preview-container" id="preview-container">
                        <span style="color: var(--text-light);"><i class="fas fa-image" style="font-size: 2rem; display: block; margin-bottom: 0.5rem;"></i>Image Preview</span>
                        <img id="image-preview" class="image-preview" alt="Preview">
                    </div>
                </div>

                <div class="form-actions">
                    <button type="submit" value="draft" class="btn btn-outline" name="status">Save as Draft</button>
                    <button type="submit" value="published" class="btn btn-primary" name="status">Publish Post</button>
                </div>
            </form>
        </div>
    </main>

    <footer>
        <div style="max-width: 1200px; margin: 0 auto; text-align: center;">
            <p style="color: #94a3b8; font-size: 0.9rem;">&copy; 2026 Campus Notes. All rights reserved.</p>
        </div>
    </footer>

    <!-- Custom JS -->
    <script src="js/script.js"></script>
</body>
</html>
