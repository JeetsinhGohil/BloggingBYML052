<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment | Campus Notes</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="logo">
                <i class="fas fa-graduation-cap logo-icon"></i> Campus Notes
            </a>
            <ul class="nav-links" id="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="assignments.html">Assignments</a></li>
                <li><a href="create.html">Create Post</a></li>
                <li><a href="dashboard.html">Dashboard</a></li>
                <li><a href="about.html">About</a></li>
            </ul>
            <div class="hamburger" id="hamburger">
                <i class="fas fa-bars"></i>
            </div>
        </div>
    </nav>

    <main>
        <div style="margin-bottom: 2rem;">
            <a href="assignments.html" class="btn btn-outline" style="padding: 0.5rem 1rem;"><i class="fas fa-arrow-left"></i> Back to Assignments</a>
        </div>

        <div style="display: grid; grid-template-columns: 1fr; gap: 2rem; max-width: 1000px; margin: 0 auto;">
            <!-- Post Content -->
            <article style="background-color: var(--card-bg); padding: 2.5rem; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);" id="post-container">
                <div id="post-content-container">
                    <!-- Populated by JS -->
                </div>
            </article>

            <!-- Related -->
            <aside style="margin-top: 3rem;">
                <h3 style="font-size: 1.5rem; margin-bottom: 1.5rem;">Related Assignments</h3>
                <div class="grid-cards" id="related-assignments">
                    <!-- Populated by JS -->
                </div>
            </aside>
        </div>
    </main>

    <footer>
        <div style="max-width: 1200px; margin: 0 auto; text-align: center;">
            <p style="color: #94a3b8; font-size: 0.9rem;">&copy; 2026 Campus Notes. All rights reserved.</p>
        </div>
    </footer>

    <!-- Custom JS -->
    <script src="js/script.js"></script>
</body>
</html>
